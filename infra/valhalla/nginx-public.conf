events { worker_connections 128; }

http {
    map_hash_bucket_size 128;
    include /run/secrets/routing-auth.conf;
    map $server_name $routing_bucket { default routing; }
    limit_req_zone $routing_bucket zone=route_rate:1m rate=10r/m;
    limit_req_zone $routing_bucket zone=recommendation_rate:1m rate=120r/m;
    limit_conn_zone $routing_bucket zone=route_connections:1m;
    # /party/ だけはトークンなしで通す（同乗者のブラウザ）。それ以外はトークンが要る。
    map $uri $party_public { default 0; ~^/party/ 1; }
    map "$routing_authorized$party_public" $gateway_allowed { default 1; "00" 0; }
    # Tunnel 経由では接続元がすべて 127.0.0.1 になるので、Cloudflare が付ける接続元 IP で数える。
    map $http_cf_connecting_ip $party_client { "" $binary_remote_addr; default $http_cf_connecting_ip; }
    limit_req_zone $party_client zone=party_client_rate:1m rate=60r/m;
    limit_req_zone $routing_bucket zone=party_total_rate:1m rate=300r/m;
    access_log off;
    error_log /dev/stderr crit;
    server {
        listen 8080;
        client_max_body_size 64k;
        client_body_timeout 10s;
        if ($gateway_allowed = 0) { return 401; }
        add_header Cache-Control "no-store" always;
        location = /search {
            limit_except GET { deny all; }
            limit_req zone=recommendation_rate burst=4 nodelay;
            limit_req_status 429;
            resolver 127.0.0.11 valid=10s;
            set $search_upstream http://scenic:8004;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_set_header Authorization "";
            proxy_pass $search_upstream;
        }
        location ~ ^/(route-recommendations|routes|navigation-sessions)(/|$) {
            limit_except GET POST DELETE { deny all; }
            client_max_body_size 1m;
            limit_req zone=recommendation_rate burst=8 nodelay;
            limit_req_status 429;
            limit_conn route_connections 4;
            limit_conn_status 429;
            resolver 127.0.0.11 valid=10s;
            set $scenic_upstream http://scenic:8004;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_set_header Authorization "";
            proxy_pass $scenic_upstream;
        }
        location = /scenic/route {
            limit_except POST { deny all; }
            limit_req zone=route_rate burst=1 nodelay;
            limit_req_status 429;
            limit_conn route_connections 1;
            limit_conn_status 429;
            resolver 127.0.0.11 valid=10s;
            set $scenic_upstream http://scenic:8004;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_set_header Authorization "";
            proxy_pass $scenic_upstream;
        }
        location = /route {
            limit_except POST { deny all; }
            limit_req zone=route_rate burst=3 nodelay;
            limit_req_status 429;
            limit_conn route_connections 2;
            limit_conn_status 429;
            proxy_connect_timeout 3s;
            proxy_read_timeout 25s;
            proxy_set_header Authorization "";
            proxy_pass http://valhalla:8002;
        }
        location = /status {
            limit_except GET { deny all; }
            limit_req zone=route_rate burst=3 nodelay;
            limit_req_status 429;
            proxy_set_header Authorization "";
            proxy_pass http://valhalla:8002;
        }
        # 景観BGM（infra/bgm-api）。/bgm を外してから渡す。/annotate は Gemini を待つので読み取り時間を長くする。
        location /bgm/ {
            limit_except GET POST { deny all; }
            client_max_body_size 1m;
            limit_req zone=recommendation_rate burst=8 nodelay;
            limit_req_status 429;
            resolver 127.0.0.11 valid=10s;
            set $bgm_upstream http://bgm:8005;
            rewrite ^/bgm(/.*)$ $1 break;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            proxy_set_header Authorization "";
            proxy_pass $bgm_upstream;
        }
        # 同乗者のリクエスト画面（infra/bgm-api の party.ts）。QR コードから開くブラウザには合言葉を持たせられないので、
        # ここだけはトークンなしで通す。推測できない code と案内ごとの期限で守り、1人あたりと全体の回数を絞る。
        location /party/ {
            limit_except GET POST { deny all; }
            client_max_body_size 4k;
            limit_req zone=party_client_rate burst=20 nodelay;
            limit_req zone=party_total_rate burst=40 nodelay;
            limit_req_status 429;
            resolver 127.0.0.11 valid=10s;
            set $party_upstream http://bgm:8005;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_set_header Authorization "";
            proxy_pass $party_upstream;
        }
        location / { return 404; }
    }
}
