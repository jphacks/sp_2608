<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1120" viewBox="0 0 1536 1120" role="img" aria-labelledby="title desc"><title id="title">景観BGMの推薦</title><desc id="desc">音楽配信サービスDeezerから複数カテゴリの人気曲を収集し、楽曲DBを準備する。プレイリストの登録は任意で、登録すると登録曲や同じアーティストの曲を加点する。景観の8つの特徴から次の1曲を選び、Spotifyで再生する。</desc><rect width="1536" height="1120" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#666" /></marker></defs><g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="48" y="72" font-size="38" font-weight="700" fill="#222">景観BGMの推薦</text><text x="48" y="116" font-size="22" font-weight="400" fill="#3d3d3d">景色を先読みし、曲調の目標と楽曲DBを照合して、次の1曲を選ぶ</text><rect x="48" y="160" width="448" height="310" fill="white" stroke="#c9c9c9" stroke-width="1.6" /><text x="72" y="205" font-size="28" font-weight="700" fill="#3d3d3d">1 楽曲DBを準備</text><text x="72" y="252" font-size="22" font-weight="400" fill="#3d3d3d">Deezerから複数カテゴリの</text><text x="72" y="288" font-size="22" font-weight="400" fill="#3d3d3d">人気曲を収集（邦楽・洋楽など）</text><text x="72" y="324" font-size="22" font-weight="400" fill="#3d3d3d">Geminiで音楽の6軸を推定</text><text x="72" y="442" font-size="18" font-weight="400" fill="#3d3d3d">catalog / annotate</text><rect x="544" y="160" width="448" height="310" fill="white" stroke="#c9c9c9" stroke-width="1.6" /><text x="568" y="205" font-size="28" font-weight="700" fill="#3d3d3d">2 好みを取り込む（任意）</text><text x="568" y="252" font-size="22" font-weight="400" fill="#3d3d3d">好みを反映したい場合に</text><text x="568" y="288" font-size="22" font-weight="400" fill="#3d3d3d">Spotifyのプレイリストを登録</text><text x="568" y="324" font-size="22" font-weight="400" fill="#3d3d3d">登録曲・同じアーティストを加点</text><text x="568" y="442" font-size="18" font-weight="400" fill="#3d3d3d">POST /annotate</text><rect x="1040" y="160" width="448" height="310" fill="white" stroke="#c9c9c9" stroke-width="1.6" /><text x="1064" y="205" font-size="28" font-weight="700" fill="#3d3d3d">3 次の区間を先読み</text><text x="1064" y="252" font-size="22" font-weight="400" fill="#3d3d3d">現在位置・予測速度・曲長を使用</text><text x="1064" y="288" font-size="22" font-weight="400" fill="#3d3d3d">次の曲が流れる区間を計算</text><text x="1064" y="324" font-size="22" font-weight="400" fill="#3d3d3d">景観の8つの特徴を集計</text><text x="1064" y="360" font-size="22" font-weight="400" fill="#3d3d3d">例：海の近さ・森林の占有率</text><text x="1064" y="442" font-size="18" font-weight="400" fill="#3d3d3d">scenic.ts / 入力のある特徴を使用</text><rect x="1040" y="530" width="448" height="310" fill="white" stroke="#c9c9c9" stroke-width="1.6" /><text x="1064" y="575" font-size="28" font-weight="700" fill="#3d3d3d">4 欲しい曲調を作る</text><text x="1064" y="622" font-size="22" font-weight="400" fill="#3d3d3d">8つの特徴から6軸の目標を計算</text><text x="1064" y="658" font-size="22" font-weight="400" fill="#3d3d3d">時刻・車内状態・運転負荷で補正</text><text x="1064" y="694" font-size="22" font-weight="400" fill="#3d3d3d">前回からの急な曲調変化を抑制</text><text x="1064" y="812" font-size="18" font-weight="400" fill="#3d3d3d">engine.ts / 固定係数による計算</text><rect x="544" y="530" width="448" height="310" fill="white" stroke="#c9c9c9" stroke-width="1.6" /><text x="568" y="575" font-size="28" font-weight="700" fill="#3d3d3d">5 候補曲を採点・抽選</text><text x="568" y="622" font-size="22" font-weight="400" fill="#3d3d3d">目標と候補曲の6軸を比較</text><text x="568" y="658" font-size="22" font-weight="400" fill="#3d3d3d">好み・共有・知名度を加点</text><text x="568" y="694" font-size="22" font-weight="400" fill="#3d3d3d">履歴・好みの偏りなどを減点</text><text x="568" y="730" font-size="22" font-weight="400" fill="#3d3d3d">得点の近い最大30曲から抽選</text><text x="568" y="812" font-size="18" font-weight="400" fill="#3d3d3d">engine.ts / modes.ts</text><rect x="48" y="530" width="448" height="310" fill="white" stroke="#c9c9c9" stroke-width="1.6" /><text x="72" y="575" font-size="28" font-weight="700" fill="#3d3d3d">6 Spotifyで再生する</text><text x="72" y="622" font-size="22" font-weight="400" fill="#3d3d3d">ISRCをSpotifyの曲IDに照合</text><text x="72" y="658" font-size="22" font-weight="400" fill="#3d3d3d">曲の終了30秒前に次曲を準備</text><text x="72" y="694" font-size="22" font-weight="400" fill="#3d3d3d">再生履歴を次の推薦に渡す</text><text x="72" y="812" font-size="18" font-weight="400" fill="#3d3d3d">POST /recommend → /link/spotify</text><line x1="496" y1="315" x2="540" y2="315" stroke="#666" stroke-width="2.2" marker-end="url(#arrow)" /><line x1="992" y1="315" x2="1036" y2="315" stroke="#666" stroke-width="2.2" marker-end="url(#arrow)" /><line x1="1264" y1="470" x2="1264" y2="526" stroke="#666" stroke-width="2.2" marker-end="url(#arrow)" /><line x1="1040" y1="685" x2="996" y2="685" stroke="#666" stroke-width="2.2" marker-end="url(#arrow)" /><line x1="544" y1="685" x2="500" y2="685" stroke="#666" stroke-width="2.2" marker-end="url(#arrow)" /><text x="48" y="901" font-size="26" font-weight="700" fill="#3d3d3d">景観の8つの特徴（入力のあるものを使用）</text><text x="48" y="943" font-size="23" font-weight="400" fill="#3d3d3d">海の近さ・海の眺望・開放度・森林・自然・田園・市街地・水辺</text><text x="48" y="994" font-size="26" font-weight="700" fill="#3d3d3d">推薦時に使うもの</text><text x="48" y="1036" font-size="23" font-weight="400" fill="#3d3d3d">景観情報 ＋ 時刻・運転状況 ＋ 車内の状態 ＋ プレイリスト（任意） ＋ 再生履歴</text><text x="48" y="1082" font-size="22" font-weight="400" fill="#3d3d3d">曲の特徴は事前に保存し、ドライブ中は決められた計算ルールで選曲します。</text><text x="72" y="360" font-size="22" fill="#3d3d3d">ISRCと特徴量をDBに保存</text><text x="72" y="396" font-size="20" fill="#3d3d3d">Deezer：音楽配信サービスの一つ</text><text x="568" y="360" font-size="22" fill="#3d3d3d">未登録曲の特徴を一度だけ推定</text><text x="568" y="396" font-size="22" fill="#3d3d3d">プレイリスト未登録でも利用可能</text></g></svg>