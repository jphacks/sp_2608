<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>道のレコードの見本</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body { overflow: hidden; height: 100%; }
      body { background: #141c18; margin: 0; display: flex; }
      .band { position: relative; flex: 1; height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; overflow: hidden; }
      .band .photo { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(14px) saturate(1.1); }
      .band .photo::after { content: ''; position: absolute; inset: 0; background: rgba(20, 28, 24, 0.25); }
      .band .course-badge { position: relative; width: min(17vw, 260px); height: auto; }
      .band figcaption { position: relative; padding: 0 12px; text-align: center; font-size: 13px; color: var(--paper); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6); }
    </style>
  </head>
  <body>
    <script type="module">
      // 道のレコードの見本
      import { roadRecord } from '/src/badges.ts'
      import { loadComparison } from '/src/compare.ts'
      const roads = [
        ['hakodate-tomoe', 'ともえ大橋（景観ロード）', 'https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/%E5%87%BD%E9%A4%A8%E6%B9%BE%E5%B2%B8%E5%A4%A7%E6%A9%8B.jpg/1920px-%E5%87%BD%E9%A4%A8%E6%B9%BE%E5%B2%B8%E5%A4%A7%E6%A9%8B.jpg'],
        ['onuma-lake', '大沼湖畔・道道338号（おすすめロード）', 'https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f5/Onuma_Park_Nanae_Hokkaido_Japan01s5.jpg/1920px-Onuma_Park_Nanae_Hokkaido_Japan01s5.jpg'],
        ['ororon', 'オロロンライン・道道106号（絶景ロード）', 'https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0c/%E3%82%AA%E3%83%AD%E3%83%AD%E3%83%B3%E3%83%A9%E3%82%A4%E3%83%B3%E6%B2%BF%E3%81%84%E9%A2%A8%E5%8A%9B%E7%99%BA%E9%9B%BB_-_panoramio.jpg/960px-%E3%82%AA%E3%83%AD%E3%83%AD%E3%83%B3%E3%83%A9%E3%82%A4%E3%83%B3%E6%B2%BF%E3%81%84%E9%A2%A8%E5%8A%9B%E7%99%BA%E9%9B%BB_-_panoramio.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail'],
        ['selected-07', '宗谷丘陵（秀逸な道）', 'https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Soya_Hills_-_panoramio.jpg/960px-Soya_Hills_-_panoramio.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail'],
        ['shiretoko-crossing', '知床横断道路（絶景ロード）', 'https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/%E7%9F%A5%E5%BA%8A%E5%B3%A0%E3%81%8B%E3%82%89%E7%BE%85%E8%87%BC%E5%B2%B3_20120906_-_panoramio.jpg/960px-%E7%9F%A5%E5%BA%8A%E5%B3%A0%E3%81%8B%E3%82%89%E7%BE%85%E8%87%BC%E5%B2%B3_20120906_-_panoramio.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail'],
      ]
      for (const [id, name, photo] of roads) {
        // 走り比べのデータが無い道は、その道の景色の推定を使う
        const comparison = await loadComparison(id)
        const scenic = comparison?.scenic ?? await fetch(`/records/scenery/${id}.json`).then((r) => (r.ok ? r.json() : undefined)).catch(() => undefined)
        document.body.insertAdjacentHTML('beforeend', `<figure class="band"><div class="photo" style="background-image: url('${photo}')"></div>${roadRecord(id, scenic)}<figcaption>${name}</figcaption></figure>`)
      }
    </script>
  </body>
</html>
